#!/usr/sbin/nft -f

flush ruleset

table inet filter {
	# ---- Chaîne INPUT : trafic à destination de l'hôte lui-même ----
	chain input {
		type filter hook input priority filter; policy accept;
	}
	# ---- Chaîne FORWARD : trafic routé à travers l'hôte ----
	chain forward {
		type filter hook forward priority filter; policy drop;

		# Laisser passer le retour du trafic déjà autorisé
		ct state established,related accept

		# Autoriser vmbr1 et vmbr2 à sortir vers Internet
        iifname { "vmbr1", "vmbr2" } oifname "enp8s0" accept
	}
	# ---- Chaîne OUTPUT : trafic sortant depuis l'hôte lui-même ----
	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip nat {
	# Ensemble des réseaux internes autorisés à être NATés
	set nat_networks {
		type ipv4_addr
		flags interval
		elements = { 10.10.10.0/24, 10.10.20.0/24 }
	}
	chain postrouting {
		type nat hook postrouting priority srcnat;
		ip saddr @nat_networks oifname "enp8s0" masquerade
	}
}
